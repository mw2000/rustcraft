name: Release

# A version tag publishes a GitHub release. Changing this workflow on combined-prs, or running it by
# hand (workflow_dispatch), builds the same archives and keeps them as workflow artifacts, to try
# the packaging without cutting a release.
on:
  push:
    tags: ['v*']
    branches: [combined-prs]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            exe: rustcraft
            server: rustcraft-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            exe: rustcraft.exe
            server: rustcraft-server.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            exe: rustcraft
            server: rustcraft-server
    steps:
      - uses: actions/checkout@v4
      # The same packages as ci.yml: gilrs needs libudev, and x11 windowing the X and xkbcommon headers.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libx11-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin rustcraft
      # The dedicated server (design.md 5.9), without the client's window, rendering and input,
      # so it needs no GPU, display or the system packages above to run.
      - name: Build the server
        run: cargo build --release --target ${{ matrix.target }} --bin rustcraft-server --no-default-features
      # The game, with its assets, and the server in an archive of its own, as it needs none.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)-dev"
          fi
          mkdir archives
          pack() {
            if [ "${{ runner.os }}" = Windows ]; then
              7z a "archives/$1.zip" "$1"
            else
              tar czf "archives/$1.tar.gz" "$1"
            fi
          }
          game="rustcraft-${version}-${{ matrix.name }}"
          mkdir "$game"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$game/"
          cp -r assets "$game/assets"
          cp README.md LICENSE-APACHE LICENSE-MIT "$game/"
          pack "$game"
          server="rustcraft-server-${version}-${{ matrix.name }}"
          mkdir "$server"
          cp "target/${{ matrix.target }}/release/${{ matrix.server }}" "$server/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$server/"
          pack "$server"
      - uses: actions/upload-artifact@v4
        with:
          name: rustcraft-${{ matrix.name }}
          path: archives/*
          if-no-files-found: error

  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          generate_release_notes: true
          body: |
            Download the archive for your system, unpack it and run `rustcraft`. The game's controls
            and commands are in the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#controls).

            To keep a world open on an always-on machine, run `rustcraft-server` from its own archive,
            which needs no display or GPU; see [Running a server](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#running-a-server).

            macOS: these builds aren't notarised, so open `rustcraft` the first time with right-click, then Open.
            Linux: needs a Vulkan driver.
