name: CI

on:
  push:
    branches: [main, combined-prs]
  pull_request:
    branches: [main, combined-prs]

env:
  CARGO_TERM_COLOR: always

# A newer push to a PR makes its older run pointless. Pushed branches finish every run, so they
# get a result and save the dependency cache, which a cancelled run never does.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bevy's gilrs feature needs libudev; its x11 windowing needs the X and xkbcommon headers.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libx11-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Release throughout, so clippy and the tests share one build of the dependencies.
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  # Whether generation agrees across platforms (D-3): multiplayer needs every client to generate
  # the same world, and float functions such as `sin` and `exp` can differ between libms.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libx11-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --lib chunks::generate::checksum
